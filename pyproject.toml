[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "library-visitor"
version = "0.1.0"
description = "Aplikasi desktop pencatat pengunjung perpustakaan dengan face recognition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    # Versi headless: menghindari bentrok plugin Qt antara OpenCV dan PySide6
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "SQLAlchemy>=2.0",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "gTTS>=2.5",
    "python-dotenv>=1.0",
    # Verifikasi tanda tangan lisensi (Ed25519)
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[project.scripts]
library-visitor = "library_visitor.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
library_visitor = ["face/antispoof_models/*", "ui/icon.png", "ui/assets/*", "web/static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

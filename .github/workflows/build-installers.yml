name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write  # untuk menerbitkan GitHub Release saat tag v* di-push

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/*-setup.exe
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            src/library_visitor/docs/Panduan-Penerima-Tamu.pdf
          body: |
            Installer Windows Penerima Tamu Perpustakaan.

            **Instalasi:** unduh `PenerimaTamuPerpustakaan-<versi>-setup.exe`, jalankan, lalu ikuti
            petunjuk. Model wajah sudah dibundel, jadi tidak perlu internet saat pertama dijalankan.
            Saat pertama dibuka, masukkan key lisensi dari penyedia aplikasi.

            Panduan pengguna lengkap ada di `Panduan-Penerima-Tamu.pdf` (juga bisa dibuka dari tombol
            **Panduan** di aplikasi).

  linux:
    # Ubuntu lama agar hasil build kompatibel dengan glibc distro yang lebih tua
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        env:
          PYTHON: python
        run: |
          python -m venv .venv
          PYTHON=.venv/bin/python bash packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installer-linux
          path: dist/*.tar.gz
